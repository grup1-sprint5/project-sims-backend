name: Deploy Backend
on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # (Opcional pero muy útil) Diagnóstico de conectividad
      - name: Check SSH port reachable
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd
          nc -vz ${{ secrets.DEPLOY_HOST_IP }} 1303

      - name: Fix permissions before upload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 1303
          script: |
            sudo chown -R $USER:www-data /var/www/sims-back/app || true
            sudo chmod -R u+w /var/www/sims-back/app || true

      - name: Upload Files (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 1303
          source: "app/**,artisan,bootstrap/app.php,bootstrap/providers.php,composer.json,composer.lock,config/**,database/**,public/**,resources/**,routes/**"
          target: "/var/www/sims-back"
          rm: false

      - name: Execute Remote Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 1303
          script: |
            cd /var/www/sims-back

            # Ensure storage directories exist and are writable by the Docker container
            mkdir -p storage/framework/sessions storage/framework/cache/data storage/framework/views storage/logs bootstrap/cache
            chmod -R 777 storage bootstrap/cache

            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              sudo systemctl reload nginx || true
            else
              echo "Skipping nginx reload: sudo without password is not available"
            fi

            # Install PHP dependencies (non-dev) and optimize autoloader
            composer install --no-dev --prefer-dist --no-interaction || true

            # Recover DB container if stopped or renamed (docker-compose v1 bug renames containers)
            DB_CONTAINER=$(docker ps -a --filter "ancestor=postgres:15" --filter "status=exited" --format "{{.Names}}" | head -1)
            if [ -n "$DB_CONTAINER" ]; then
              echo "Starting DB: $DB_CONTAINER"
              docker start "$DB_CONTAINER"
              docker rename "$DB_CONTAINER" project_sims_db 2>/dev/null || true
              sleep 6
            fi

            # Recover App container if stopped or renamed
            APP_CONTAINER=$(docker ps -a --filter "ancestor=project-sims-backend_app" --filter "status=exited" --format "{{.Names}}" | grep -v scheduler | head -1)
            if [ -n "$APP_CONTAINER" ]; then
              echo "Starting App: $APP_CONTAINER"
              docker start "$APP_CONTAINER"
              docker rename "$APP_CONTAINER" project_sims_app 2>/dev/null || true
            fi
            # Also try by name in case it's already correctly named but stopped
            docker start project_sims_app 2>/dev/null || true
            sleep 20

            # Run application migrations inside Docker container
            docker exec project_sims_app php artisan migrate --force || true

            # Ensure tenant schemas/databases are created and migrated
            docker exec project_sims_app php artisan tenants:check-integrity --repair || true

            # Rebuild caches inside Docker container
            docker exec project_sims_app php artisan config:cache || true
            docker exec project_sims_app php artisan route:cache || true
            docker exec project_sims_app php artisan view:cache || true
