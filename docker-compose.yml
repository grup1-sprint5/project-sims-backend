services:
  app:
    build: .
    image: project-sims-backend_app
    container_name: project_sims_app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    working_dir: /var/www/html
    env_file:
      - .env
    depends_on:
      - db
      - mongo
    ports:
      - "8001:8001"
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8001"]

  scheduler:
    image: project-sims-backend_app
    container_name: project_sims_scheduler
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    working_dir: /var/www/html
    env_file:
      - .env
    depends_on:
      - db
      - mongo
    command: ["php", "artisan", "schedule:work"]

  db:
    image: postgres:15
    container_name: project_sims_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_HOST_PORT:-5433}:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: project_sims_pgadmin
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - db

  mongo:
    image: mongo:6
    container_name: project_sims_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  postgres_data:
  pgadmin_data:
  vendor: